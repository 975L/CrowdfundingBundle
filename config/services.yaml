services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    c975L\CrowdfundingBundle\:
        resource: '../src/'
        exclude: '../src/{DependencyInjection,Entity,Message}'

    # After PaymentBundle's sheet (priority 20), whose basket rules the counterparts build on
    c975L\CrowdfundingBundle\Service\StylesheetProvider:
        tags:
            - { name: 'ui.stylesheet', priority: 10 }

    # After PaymentBundle's barrel (priority 100 as well, registered first): the counterparts draw its basket buttons, the lottery only adds its own wheel
    c975L\CrowdfundingBundle\Service\ScriptProvider:
        tags:
            - { name: 'ui.script', priority: 100 }

    # The one kind of this bundle placed on an ordinary page rather than on a campaign's own: it lists the campaigns a visitor may read, live from the repository (see CrowdfundingBlockExtension), with no "contexts" hence offered everywhere - and never cached, for the reason the counterparts are not, each card printing the days left against today where no event fires the day a campaign starts or ends
    crowdfunding.block.campaigns:
        class: stdClass
        tags:
            - name: ui.block
              kind: crowdfunding_campaigns
              label: 'label.block_campaigns'
              description: 'label.block_campaigns_description'
              translation_domain: 'crowdfunding'
              category: 'label.category_crowdfunding'
              form: 'c975L\CrowdfundingBundle\Form\Block\CampaignsBlockType'
              translatable: 'eyebrow, title, content, linkLabel'
              template: '@c975LCrowdfunding/blocks/Campaigns.html.twig'
              pickable: true
              cacheable: false

    # The three kinds composing a campaign page: each reads the campaign of the route it is rendered on (see CrowdfundingBlockExtension) and stores only how to show it, "contexts" keeping the sections out of a flex column where a full-width grid of tiers has no room
    crowdfunding.block.slider:
        class: stdClass
        tags:
            - name: ui.block
              kind: crowdfunding_slider
              label: 'label.block_slider'
              description: 'label.block_slider_description'
              translation_domain: 'crowdfunding'
              category: 'label.category_crowdfunding'
              form: 'c975L\CrowdfundingBundle\Form\Block\SliderBlockType'
              template: '@c975LCrowdfunding/blocks/Slider.html.twig'
              pickable: true
              cacheable: true
              contexts: 'crowdfunding,flex_slot,flex_slot_nested'

    crowdfunding.block.counterparts:
        class: stdClass
        tags:
            - name: ui.block
              kind: crowdfunding_counterparts
              label: 'label.block_counterparts'
              description: 'label.block_counterparts_description'
              translation_domain: 'crowdfunding'
              category: 'label.category_crowdfunding'
              form: 'c975L\CrowdfundingBundle\Form\Block\CounterpartsBlockType'
              translatable: 'title'
              template: '@c975LCrowdfunding/blocks/Counterparts.html.twig'
              pickable: true
              # Never cached, as ShopBundle's "shop_search" is not: each tier draws its own button against today's date, and no event fires the day a campaign ends, so an entry that never expires would keep offering to contribute to a campaign that closed - and the basket messages laid beside the tiers belong to whoever is reading, not to everybody
              cacheable: false
              contexts: 'crowdfunding'

    crowdfunding.block.lottery:
        class: stdClass
        tags:
            - name: ui.block
              kind: crowdfunding_lottery
              label: 'label.block_lottery'
              description: 'label.block_lottery_description'
              translation_domain: 'crowdfunding'
              category: 'label.category_crowdfunding'
              form: 'c975L\CrowdfundingBundle\Form\Block\LotteryBlockType'
              translatable: 'title, intro'
              template: '@c975LCrowdfunding/blocks/Lottery.html.twig'
              pickable: true
              # Never cached either: the draws print their dates in the visitor's own timezone (see Lottery.html.twig, app.session.get('user_timezone')) and offer the draw button to an administrator alone, where an entry is shared by everyone reading the page
              cacheable: false
              contexts: 'crowdfunding'
